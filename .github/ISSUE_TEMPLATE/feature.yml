name: 이런 예제가 있었으면 합니다
description: 새로운 예제나 개선할 점을 제안해 주십시오.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |
      이 저장소는 라이브러리가 아니라 **예제 모음**입니다.
      읽고 고쳐 쓰기 쉬운 짧은 코드를 지향하다 보니, 자동 재시도·백오프나 웹소켓 재연결
      같은 운영 기능은 일부러 넣지 않았습니다. 제안하실 때 참고해 주십시오.
      (호출 한도 준수·커넥션 재사용·토큰 재사용·로깅은 이미 들어 있습니다.)

      API 자체에 새 기능이 필요하신 경우에는 이곳이 아니라 개발자 포털로 보내 주십시오.
- type: textarea
  id: problem
  attributes:
    label: 어떤 점이 아쉬우셨습니까
    description: 무엇을 하려다가 막히셨는지 적어 주십시오.
    placeholder: 연속 조회를 여러 번 도는 코드를 만들려는데, 마지막 페이지인지 판단하는 방법을 찾기 어려웠습니다.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: 어떻게 되면 좋겠습니까
  validations:
    required: true
- type: input
  id: api-path
  attributes:
    label: 관련된 API 경로
    placeholder: /accounts/v1/me/transactions
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 비슷한 제안이 이미 올라와 있는지 찾아보았습니다.
      required: false
    - label: 주문 예제의 확인 단계를 빼자는 제안이 아닙니다.
      required: true
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
