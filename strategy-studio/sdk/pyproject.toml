[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meritz-strategy-sdk"
version = "0.1.0"
description = "Local Meritz strategy intent helpers; no live orders or standalone broker"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["meritz_strategy"]

[tool.hatch.build.targets.wheel.force-include]
"../indicators/__init__.py" = "indicators/__init__.py"
"../indicators/calc.py" = "indicators/calc.py"
"../indicators/PROVENANCE.md" = "indicators/PROVENANCE.md"
