[project]
name = "meritz-open-api-mcp"
version = "0.5.0b1"
description = "메리츠증권 Open API MCP 서버 (config 기반 API 노출)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meritz Securities Co., Ltd." }]
dependencies = [
    "fastmcp>=3.4.10,<4",
    "requests>=2.31.0",
    "tzdata==2026.6",
    # 자체 창(임베디드 웹뷰) 실행. 맥 WKWebView(pyobjc) / 윈도우 WebView2(pythonnet) 백엔드를 플랫폼별로 끌어온다.
    # 미설치 환경에서는 runtime.server.main(window=True)가 브라우저 모드로 폴백한다. 핀 환경(macos-arm64 pins)은 재생성 필요.
    "pywebview>=6,<7",
]


[project.scripts]
meritz-mcp = "meritz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meritz"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller==6.22.3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # 줄 길이는 line-length 로 본다
